<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSahayak - Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b151e;
            --card-bg: rgba(20, 35, 50, 0.45);
            --border-color: rgba(0, 173, 179, 0.25);
            --primary: #00adb3;
            --primary-hover: #00878c;
            --text-color: #e5f5f6;
            --text-muted: #8ea8aa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #090f16;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(11, 21, 30, 0.85);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .chat-layout {
            flex: 1;
            display: flex;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            overflow: hidden;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            background: rgba(25, 45, 65, 0.6);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(0, 173, 179, 0.15);
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            background: rgba(11, 21, 30, 0.85);
        }

        .mic-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mic-btn {
            background: rgba(0, 173, 179, 0.1);
            border: 2px solid var(--primary);
            color: var(--primary);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 2rem;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mic-btn:hover {
            background: rgba(0, 173, 179, 0.3);
            transform: scale(1.05);
        }

        .mic-btn.recording {
            background: rgba(255, 82, 82, 0.2);
            border-color: #ff5252;
            color: #ff5252;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.4); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(255, 82, 82, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }
        }

        .status-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">MediSahayak</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="chatbot.html">AI Chatbot</a>
            <a href="voice-assistant.html" style="color: var(--primary);">Voice Assistant</a>
            <a href="http://127.0.0.1:7860" target="_blank">AI Vision Doctor</a>
            <a href="report-analyzer.html">Report Analyzer</a>
        </div>
    </nav>

    <div class="chat-layout">
        <div id="chat-messages" class="chat-messages">
            <div class="message assistant">
                Hello! I am your real-time Voice Assistant. Click the microphone below and speak to me, and I will reply using voice!
            </div>
        </div>

        <div class="chat-input-area">
            <div class="mic-wrapper">
                <button id="mic-btn" class="mic-btn" onclick="toggleSpeech()" title="Tap to Speak">🎤</button>
            </div>
            <div id="status-text" class="status-text">Tap the microphone to start speaking</div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isRecording = false;
        let lastResponse = "";

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById("status-text").textContent = "Sending your voice message...";
                appendMessage("user", text);
                sendToFlaskBackend(text);
                stopSpeech();
            };

            recognition.onerror = function() {
                document.getElementById("status-text").textContent = "Speech recognition error. Please try again.";
                stopSpeech();
            };

            recognition.onend = function() {
                stopSpeech();
            };
        }

        function toggleSpeech() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            if (isRecording) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            isRecording = true;
            document.getElementById("mic-btn").classList.add("recording");
            document.getElementById("status-text").textContent = "Listening...";
            recognition.start();
        }

        function stopSpeech() {
            isRecording = false;
            document.getElementById("mic-btn").classList.remove("recording");
            if(document.getElementById("status-text").textContent === "Listening...") {
                document.getElementById("status-text").textContent = "Tap the microphone to start speaking";
            }
            if(recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        async function sendToFlaskBackend(text) {
            try {
                await fetch("http://localhost:5000/chatbot", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_input: text })
                });
                document.getElementById("status-text").textContent = "Processing... Please wait for voice reply.";
            } catch (err) {
                console.error(err);
                document.getElementById("status-text").textContent = "Error connecting to the Voice Server (is hey.py running?).";
            }
        }

        function appendMessage(sender, content) {
            const messagesDiv = document.getElementById("chat-messages");
            const msg = document.createElement("div");
            msg.className = `message ${sender}`;
            msg.innerHTML = content.replace(/\n/g, "<br>");
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[*#_]/g, '').replace(/<[^>]*>?/gm, '');
            const msg = new SpeechSynthesisUtterance(cleanText);
            msg.lang = 'en-IN';
            window.speechSynthesis.speak(msg);
        }

        // Poll the /hey endpoint every 2 seconds for a new response
        setInterval(async () => {
            try {
                const res = await fetch("http://localhost:5000/hey");
                const data = await res.json();
                
                // If there's a response and it's new
                if (data.user_input && data.user_input !== lastResponse && data.user_input !== "") {
                    lastResponse = data.user_input;
                    appendMessage("assistant", lastResponse);
                    speakText(lastResponse);
                    document.getElementById("status-text").textContent = "Tap the microphone to start speaking";
                }
            } catch (err) {
                // Ignore if server isn't running yet
            }
        }, 2000);
    </script>
</body>
</html>
