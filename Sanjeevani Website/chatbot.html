<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSahayak - AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b151e;
            --card-bg: rgba(20, 35, 50, 0.45);
            --border-color: rgba(0, 173, 179, 0.25);
            --primary: #00adb3;
            --primary-hover: #00878c;
            --text-color: #e5f5f6;
            --text-muted: #8ea8aa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #090f16;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(11, 21, 30, 0.85);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .chat-layout {
            flex: 1;
            display: flex;
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .sessions-sidebar {
            width: 250px;
            border-right: 1px solid var(--border-color);
            background: rgba(10, 20, 30, 0.3);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .new-chat-btn:hover {
            background: var(--primary-hover);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .session-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 173, 179, 0.1);
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .session-item:hover, .session-item.active {
            background: rgba(0, 173, 179, 0.1);
            color: var(--text-color);
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 20, 30, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            background: rgba(25, 45, 65, 0.6);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(0, 173, 179, 0.15);
        }

        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(11, 21, 30, 0.85);
        }

        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            background: rgba(10, 20, 30, 0.7);
            border: 1px solid rgba(0, 173, 179, 0.2);
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .mic-btn, .send-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .mic-btn:hover, .send-btn:hover {
            background: rgba(0, 173, 179, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .mic-btn.recording {
            background: rgba(255, 82, 82, 0.2);
            border-color: #ff5252;
            color: #ff5252;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">MediSahayak</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="chatbot.html" style="color: var(--primary);">AI Chatbot</a>
            <a href="voice-assistant.html">Voice Assistant</a>
            <a href="http://127.0.0.1:7860" target="_blank">AI Vision Doctor</a>
            <a href="report-analyzer.html">Report Analyzer</a>
            <a href="predict.html">Symptom Checker</a>
            <a href="hospital-finder.html">Hospital Finder</a>
        </div>
    </nav>

    <div class="chat-layout">
        <!-- Sessions Sidebar -->
        <div class="sessions-sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
            </div>
            <ul id="session-list" class="session-list">
                <!-- Chat Sessions will be listed here -->
            </ul>
        </div>

        <!-- Chat Area -->
        <div class="chat-main">
            <div id="chat-messages" class="chat-messages">
                <div class="message assistant">
                    Hello! I am MediSahayak, your AI healthcare assistant. How can I help you today?
                </div>
            </div>

            <div class="chat-input-area">
                <button id="speaker-btn" class="mic-btn" onclick="toggleSpeaker()" title="Toggle Voice Output">🔊</button>
                <button id="mic-btn" class="mic-btn" onclick="toggleSpeech()" title="Voice Input">🎤</button>
                <input type="text" id="chat-input" class="chat-input" placeholder="Type your symptom or health question..." onkeydown="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()" title="Send">✈️</button>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        let currentSessionId = null;
        let recognition = null;
        let isRecording = false;
        let isSpeakerOn = true;

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const btn = document.getElementById("speaker-btn");
            if (isSpeakerOn) {
                btn.textContent = "🔊";
                btn.classList.remove("recording");
            } else {
                btn.textContent = "🔇";
                btn.classList.add("recording");
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!isSpeakerOn || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Stop current speech
            // Remove markdown or HTML tags for clear speech
            const cleanText = text.replace(/[*#_]/g, '').replace(/<[^>]*>?/gm, '');
            const msg = new SpeechSynthesisUtterance(cleanText);
            msg.lang = 'en-IN';
            window.speechSynthesis.speak(msg);
        }

        // Initialize Speech Recognition if supported
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN'; // Standard Indian English accent. Can switch languages dynamically.

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById("chat-input").value = text;
                stopSpeech();
            };

            recognition.onerror = function() {
                stopSpeech();
            };

            recognition.onend = function() {
                stopSpeech();
            };
        }

        function toggleSpeech() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            if (isRecording) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            isRecording = true;
            document.getElementById("mic-btn").classList.add("recording");
            recognition.start();
        }

        function stopSpeech() {
            isRecording = false;
            document.getElementById("mic-btn").classList.remove("recording");
            if(recognition) {
                recognition.stop();
            }
        }

        async function loadSessions() {
            try {
                const sessions = await makeRequest("/chat/sessions");
                const list = document.getElementById("session-list");
                list.innerHTML = "";
                
                sessions.forEach(s => {
                    const li = document.createElement("li");
                    li.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                    const date = new Date(s.created_at).toLocaleDateString();
                    li.textContent = `Chat session - ${date}`;
                    li.onclick = () => selectSession(s.id);
                    list.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function selectSession(id) {
            currentSessionId = id;
            loadSessions();
            
            try {
                const history = await makeRequest(`/chat/history/${id}`);
                const messagesDiv = document.getElementById("chat-messages");
                messagesDiv.innerHTML = "";
                
                history.forEach(h => {
                    appendMessage(h.role === 'user' ? 'user' : 'assistant', h.content);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function startNewChat() {
            currentSessionId = null;
            document.getElementById("chat-messages").innerHTML = `
                <div class="message assistant">
                    Started a new consultation. Describe your symptoms or ask about diet/general health.
                </div>
            `;
            loadSessions();
        }

        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            appendMessage("user", text);
            
            try {
                const res = await makeRequest("/chat/message", "POST", {
                    message: text,
                    session_id: currentSessionId
                });
                
                appendMessage("assistant", res.response);
                speakText(res.response);
                if (!currentSessionId) {
                    currentSessionId = res.session_id;
                    loadSessions();
                }
            } catch (err) {
                appendMessage("assistant", "Sorry, I could not reach the server. Please try again.");
            }
        }

        function appendMessage(sender, content) {
            const messagesDiv = document.getElementById("chat-messages");
            const msg = document.createElement("div");
            msg.className = `message ${sender}`;
            msg.innerHTML = content.replace(/\n/g, "<br>");
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadSessions();
        });
    </script>
</body>
</html>
