<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSahayak - Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b151e;
            --card-bg: rgba(20, 35, 50, 0.45);
            --border-color: rgba(0, 173, 179, 0.35);
            --primary: #00adb3;
            --primary-hover: #00878c;
            --text-color: #e5f5f6;
            --text-muted: #8ea8aa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #102636 0%, var(--bg-color) 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        .auth-header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(0, 173, 179, 0.15);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            padding: 12px;
            background: rgba(10, 20, 30, 0.7);
            border: 1px solid rgba(0, 173, 179, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 173, 179, 0.4);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 173, 179, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .toggle-form {
            display: none;
        }

        .toggle-form.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>MediSahayak</h1>
            <p>Your AI Health Companion</p>
        </div>

        <div class="tabs">
            <div id="login-tab" class="tab active" onclick="switchTab('login')">Login</div>
            <div id="register-tab" class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="toggle-form active" onsubmit="submitLogin(event)">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="toggle-form" onsubmit="submitRegister(event)">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input type="text" id="reg-phone" placeholder="9876543210">
            </div>
            <div class="form-group">
                <label for="reg-role">Role</label>
                <select id="reg-role" onchange="toggleDoctorFields()">
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="pharmacist">Pharmacist</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg-state">State</label>
                <input type="text" id="reg-state" placeholder="e.g., Andhra Pradesh">
            </div>
            <div class="form-group">
                <label for="reg-district">District</label>
                <input type="text" id="reg-district" placeholder="e.g., Guntur">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <div class="back-home">
            <a href="index.html">← Back to Homepage</a>
        </div>
    </div>

    <!-- API configuration and Auth handling scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // Disable automatic redirect on login page if unauthorized
        function checkAuth() {}

        function switchTab(type) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".toggle-form").forEach(f => f.classList.remove("active"));

            if (type === 'login') {
                document.getElementById("login-tab").classList.add("active");
                document.getElementById("login-form").classList.add("active");
            } else {
                document.getElementById("register-tab").classList.add("active");
                document.getElementById("register-form").classList.add("active");
            }
        }

        function submitLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-password").value;
            handleLogin(email, pass);
        }

        function submitRegister(e) {
            e.preventDefault();
            const name = document.getElementById("reg-name").value;
            const email = document.getElementById("reg-email").value;
            const pass = document.getElementById("reg-password").value;
            const phone = document.getElementById("reg-phone").value;
            const role = document.getElementById("reg-role").value;
            const state = document.getElementById("reg-state").value;
            const dist = document.getElementById("reg-district").value;
            handleRegister(name, email, pass, phone, role, state, dist);
        }
    </script>
</body>
</html>
